<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinn Database</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--k:#111;--y:#ffd60a;--b:#3b5bdb;--g:#12b886;--r:#f03e3e;--c:#fff8e1;--e:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:500 14px 'Space Grotesk',sans-serif;color:var(--k);background:#e6e6e6;background-image:linear-gradient(#d4d4d4 1px,transparent 1px),linear-gradient(90deg,#d4d4d4 1px,transparent 1px);background-size:32px 32px;min-height:100vh}
.mono{font-family:'Space Mono',monospace}
.card{background:#fff;border:3px solid var(--k);border-radius:18px;box-shadow:5px 5px 0 var(--k);padding:16px;transition:transform .25s var(--e),box-shadow .25s var(--e)}
.card.h:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--k)}
.btn{font:700 13px 'Space Grotesk';border:3px solid var(--k);border-radius:12px;background:#fff;padding:9px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--k);transition:transform .15s var(--e),box-shadow .15s var(--e),background .2s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--k)}.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--k)}
.btn.y{background:var(--y)}.btn.b{background:var(--b);color:#fff}.btn.r{background:var(--r);color:#fff}.btn.g{background:var(--g);color:#fff}.btn.s{padding:5px 9px;font-size:12px;box-shadow:2px 2px 0 var(--k)}
input,textarea{width:100%;font:500 14px 'Space Mono',monospace;background:var(--c);border:3px solid var(--k);border-radius:12px;padding:11px 13px;box-shadow:3px 3px 0 var(--k);outline:0;transition:box-shadow .2s,transform .2s}
input:focus,textarea:focus{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--b)}
label{display:block;font-weight:700;margin:12px 0 6px}
.tag{display:inline-block;border:2px solid var(--k);border-radius:8px;padding:2px 8px;font:700 11px 'Space Mono';background:var(--y)}.tag.b{background:var(--b);color:#fff}.tag.r{background:var(--r);color:#fff}.tag.g{background:var(--g);color:#fff}
h1,h2{font-weight:700;letter-spacing:-.5px}h2{font-size:26px}.sub{font:400 12px 'Space Mono';color:#555;margin-top:4px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}#login .card{width:100%;max-width:400px;box-shadow:12px 12px 0 var(--k);padding:26px;animation:pop .6s var(--e)}
#login img,.logo{width:78px;height:78px;border:3px solid var(--k);border-radius:18px;box-shadow:4px 4px 0 var(--k);display:block;margin:0 auto 14px;background:var(--b);object-fit:cover;animation:bob 3s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.94)}}@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}@keyframes in{from{opacity:0;transform:translateY(14px)}}
#app{display:none}
#side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--c);border-right:3px solid var(--k);padding:16px;z-index:30;transition:transform .45s var(--e);overflow:auto}
#side .bt{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:9px;text-align:left;transition:transform .25s var(--e),background .2s,box-shadow .15s}
#side .bt:hover{transform:translateX(5px)}#side .bt.on{background:var(--y);transform:translateX(5px)}
#ov{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}
main{margin-left:250px;padding:0 18px 90px}
.top{display:flex;align-items:center;gap:12px;padding:16px 0}#burger{display:none}
.run{overflow:hidden;border:3px solid var(--k);border-radius:12px;background:var(--y);box-shadow:3px 3px 0 var(--k);margin-bottom:16px;white-space:nowrap}.run span{display:inline-block;padding:8px 0;font:700 13px 'Space Mono';animation:mq 18s linear infinite}@keyframes mq{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.pg{animation:in .45s var(--e)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:16px 0}
.big{font:700 44px 'Space Grotesk';line-height:1.1;margin-top:8px}
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;border:3px solid var(--k);border-radius:12px;background:var(--c);padding:12px 12px 0;margin-top:12px}.chart div{flex:1;text-align:center;font:700 11px 'Space Mono'}
.bar{border:3px solid var(--k);border-bottom:0;border-radius:6px 6px 0 0;margin-top:4px;background:var(--b);transform-origin:bottom;animation:grow .8s var(--e) backwards}.chart div:nth-child(even) .bar{background:var(--y)}@keyframes grow{from{transform:scaleY(0)}}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;border:3px solid var(--k);border-radius:12px;background:#fff;padding:10px 12px;margin-top:10px;flex-wrap:wrap;animation:in .4s var(--e) backwards}.row.ban{background:#ffe3e3}
.sw{width:58px;height:30px;border:3px solid var(--k);border-radius:20px;background:#ddd;position:relative;cursor:pointer;transition:background .3s;flex:none}.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border:3px solid var(--k);border-radius:50%;background:#fff;transition:transform .35s var(--e)}.sw.on{background:var(--g)}.sw.on i{transform:translateX(28px)}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);z-index:99;transition:transform .45s var(--e);max-width:92vw}#toast.show{transform:translate(-50%,0)}
#sos{position:fixed;right:16px;bottom:16px;z-index:25;text-decoration:none;color:#fff;background:var(--r);animation:pulse 2s infinite}@keyframes pulse{50%{transform:scale(1.07)}}
#mt{position:fixed;inset:0;display:none;place-items:center;background:var(--y);z-index:90;text-align:center;padding:24px}
@media(max-width:820px){#side{transform:translateX(-105%)}body.open #side{transform:none;box-shadow:8px 0 0 var(--k)}body.open #ov{opacity:1;pointer-events:auto}main{margin-left:0}#burger{display:block}h2{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="toast" class="card"></div>
<div id="mt"><div class="card" style="max-width:380px;padding:26px"><div style="font-size:50px">🛠️</div><h2>Sedang maintenance</h2><p class="sub" id="mtx">Coba lagi beberapa saat lagi.</p><button class="btn y" style="margin-top:16px" onclick="location.reload()">Muat ulang</button></div></div>
<section id="login"><form class="card" onsubmit="return doLogin(event)"><img src="https://i.ibb.co/placeholder" alt="" onerror="this.removeAttribute('src')"><h2 style="text-align:center;font-size:30px" id="lname">MASUK AKUN</h2><p class="sub" style="text-align:center">DATABASE &amp; WHATSAPP BOT</p>
<div style="text-align:center;margin:12px 0"><span class="tag">ENCRYPTED</span> <span class="tag b">FAST LOGIN</span> <span class="tag">NO STORE PW</span></div>
<label>Username</label><input id="u" placeholder="Masukkan username..." autocomplete="username"><label>Password</label><input id="p" type="password" placeholder="Masukkan password..." autocomplete="current-password">
<button class="btn b" style="width:100%;margin-top:18px;padding:14px;font-size:15px">Masuk sekarang</button><p class="sub" id="lrun" style="margin-top:12px"></p></form></section>
<div id="app"><aside id="side"><div class="logo" style="width:56px;height:56px;margin:0 0 4px"></div><h2 id="sname" style="font-size:20px"></h2><p class="sub" id="who" style="margin-bottom:16px"></p><nav id="nav"></nav><button class="btn r" style="width:100%;margin-top:14px" onclick="out()">Keluar</button></aside><div id="ov" onclick="document.body.classList.remove('open')"></div>
<main><div class="top"><button id="burger" class="btn y" onclick="document.body.classList.add('open')">☰</button><div><h2 id="ttl"></h2><p class="sub" id="sb"></p></div></div><div id="rt"></div><div id="pg" class="pg"></div></main>
<a id="sos" class="btn" target="_blank">🚨 Kontak darurat</a></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let T=localStorage.t||'',D=null,PG='dash',Q='';
const NAV={dash:['📊','Dashboard','Statistik database realtime'],nomor:['📱','Kelola Nomor','Tambah dan atur nomor bot'],link:['🔗','Link Validate','Link validasi untuk bot'],info:['📣','Info & Maintenance','Running text dan mode maintenance'],set:['⚙️','Pengaturan','Atur seluruh web database'],log:['🧾','Log Aktivitas','Riwayat aksi terbaru']};
function toast(m,c){const t=$('#toast');t.textContent=m;t.style.background=c||'#fff';t.classList.add('show');clearTimeout(t.x);t.x=setTimeout(()=>t.classList.remove('show'),2600)}
async function api(a,b={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,token:T,...b})}),j=await r.json().catch(()=>({}));
 if(r.status===503){$('#mtx').textContent=j.run||'Coba lagi beberapa saat lagi.';$('#mt').style.display='grid';throw Error('maintenance')}
 if(r.status===401&&a!=='login'){out(1)}if(!r.ok)throw Error(j.error||'Gagal');return j}
const go=async f=>{try{return await f()}catch(e){if(e.message!=='maintenance')toast(e.message,'#ffa8a8')}};
async function doLogin(e){e.preventDefault();go(async()=>{const j=await api('login',{username:$('#u').value,password:$('#p').value});T=localStorage.t=j.token;boot()});return false}
function out(s){T=localStorage.t='';$('#app').style.display='none';$('#login').style.display='grid';if(!s)toast('Sampai jumpa!')}
async function boot(){await go(async()=>{D=await api('state');$('#login').style.display='none';$('#app').style.display='block';document.body.classList.remove('open');shell();show(PG in NAV&&(PG==='dash'||PG==='nomor'||D.me.role==='dev')?PG:'dash')})}
function shell(){const m=D.me,p=D.pub;$('#sname').textContent=p.name;$('#who').innerHTML=`${E(m.name)} <span class="tag ${m.role==='dev'?'r':m.role==='pt'?'b':'g'}">${m.role.toUpperCase()}</span>`;
 $('#sos').href='https://wa.me/'+p.emg.replace(/^0/,'62').replace(/\D/g,'');
 const ks=m.role==='dev'?Object.keys(NAV):['dash','nomor'];$('#nav').innerHTML=ks.map(k=>`<button class="btn bt ${k===PG?'on':''}" data-k="${k}" onclick="show('${k}')">${NAV[k][0]} ${NAV[k][1]}</button>`).join('');
 $('#rt').innerHTML=p.run?`<div class="run"><span>📣 ${E(p.run)}</span></div>`:''}
async function show(k){PG=k;document.body.classList.remove('open');document.querySelectorAll('#nav .bt').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('#ttl').textContent=NAV[k][1];$('#sb').textContent=NAV[k][2];
 D=await api('state').catch(()=>D);shell();const el=$('#pg');el.style.animation='none';el.offsetWidth;el.style.animation='';el.innerHTML=V[k]();if(k==='dash')count()}
function count(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n;let i=0;const t=setInterval(()=>{i+=Math.max(1,Math.ceil(n/25));if(i>=n){i=n;clearInterval(t)}e.textContent=i},24)})}
const fmt=t=>new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),can=a=>D.me.can.includes(a);
const V={
dash:()=>{const mx=Math.max(1,...D.week.map(w=>w.n));return`<div class="grid"><div class="card h" style="border-bottom:8px solid var(--b)"><span class="tag b">TOTAL DATABASE</span><div class="big" data-n="${D.total}">0</div><p class="sub">Total nomor tersimpan</p></div><div class="card h" style="border-bottom:8px solid var(--g)"><span class="tag g">REALTIME TODAY</span><div class="big" data-n="${D.today}">0</div><p class="sub">Nomor ditambahkan hari ini</p></div><div class="card h" style="border-bottom:8px solid var(--r)"><span class="tag r">DIBANNED</span><div class="big" data-n="${D.banned}">0</div><p class="sub">Nomor diblokir</p></div></div>
<div class="card"><h2 style="font-size:19px">Statistik penambahan</h2><p class="sub">Aktivitas nomor 7 hari terakhir</p><div class="chart">${D.week.map((w,i)=>`<div style="height:100%;display:flex;flex-direction:column;justify-content:flex-end">${w.n}<span class="bar" style="height:${w.n/mx*85+3}%;animation-delay:${i*.08}s"></span><small style="padding:6px 0">${w.d}</small></div>`).join('')}</div></div>`},
nomor:()=>{const l=D.numbers.filter(n=>n.num.includes(Q.replace(/\D/g,'')));return`<div class="card"><h2 style="font-size:19px">Tambah nomor</h2><p class="sub">Satu nomor per baris atau pisah koma. Format 08xx atau 628xx.</p><textarea id="na" rows="3" placeholder="628123456789"></textarea><button class="btn y" style="margin-top:12px" onclick="addN()">Tambah nomor</button></div>
<div class="card" style="margin-top:16px"><div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><h2 style="font-size:19px">Daftar nomor (${l.length})</h2><input style="max-width:220px" placeholder="Cari nomor..." value="${E(Q)}" oninput="Q=this.value;clearTimeout(window.sq);window.sq=setTimeout(()=>{$('#pg').innerHTML=V.nomor();const i=$('#pg input:not(#na)');i.focus();i.setSelectionRange(99,99)},250)"></div>
${l.slice(0,200).map((n,i)=>`<div class="row ${n.banned?'ban':''}" style="animation-delay:${Math.min(i,15)*.03}s"><div><b class="mono">${n.num}</b> ${n.banned?'<span class="tag r">BAN</span>':''}<div class="sub">oleh ${E(n.by)} (${n.role}) · ${fmt(n.at)}</div></div><div>${can('ban')?`<button class="btn s" onclick="act('ban','${n.num}')">${n.banned?'Unban':'Ban'}</button> `:''}${can('del')?`<button class="btn s r" onclick="confirm('Hapus ${n.num}?')&&act('del','${n.num}')">Hapus</button>`:''}</div></div>`).join('')||'<p class="sub" style="margin-top:14px">Belum ada nomor. Tambahkan nomor pertama di atas.</p>'}</div>`},
link:()=>{const u=location.origin+'/api/validate?key='+D.vkey;return`<div class="card"><h2 style="font-size:19px">Link validate</h2><p class="sub">Dipakai bot WhatsApp / Telegram. Isinya hanya nomor yang sudah ditambahkan di website (nomor ban/hapus tidak valid).</p>
<label>Daftar semua nomor</label><input readonly value="${u}" onclick="this.select()"><button class="btn y s" style="margin-top:8px" onclick="cp('${u}')">Salin</button> <a class="btn s b" href="${u}" target="_blank" style="text-decoration:none;display:inline-block">Buka</a>
<label>Cek satu nomor</label><input readonly value="${u}&number=628xxxxxxxxxx" onclick="this.select()"><button class="btn y s" style="margin-top:8px" onclick="cp('${u}&number=')">Salin (tambahkan nomor di akhir)</button>
<label>Format teks</label><input readonly value="${u}&format=txt" onclick="this.select()"><hr style="margin:16px 0;border:2px dashed #111"><button class="btn r" onclick="confirm('Key lama langsung tidak berlaku. Lanjut?')&&gg('newkey','Key baru dibuat')">Buat key baru</button></div>`},
info:()=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h2 style="font-size:19px">Mode maintenance</h2><p class="sub">PT dan reseller tidak bisa masuk saat aktif. Dev tetap bisa.</p></div><div class="sw ${D.pub.maint?'on':''}" onclick="gg('save','Tersimpan',{maint:${!D.pub.maint}})"><i></i></div></div></div>
<div class="card" style="margin-top:16px"><h2 style="font-size:19px">Info running text</h2><p class="sub">Teks berjalan di atas semua halaman. Kosongkan untuk menyembunyikan.</p><input id="rn" maxlength="300" value="${E(D.pub.run)}" placeholder="Contoh: Server update jam 22.00 WIB"><button class="btn y" style="margin-top:12px" onclick="gg('save','Running text tersimpan',{run:$('#rn').value})">Simpan teks</button></div>`,
set:()=>`<div class="card"><h2 style="font-size:19px">Umum</h2><label>Nama website</label><input id="sn" value="${E(D.pub.name)}"><label>Kontak darurat (WhatsApp)</label><input id="se" value="${E(D.pub.emg)}"><button class="btn y" style="margin-top:12px" onclick="gg('save','Pengaturan tersimpan',{name:$('#sn').value,emg:$('#se').value})">Simpan</button></div>
<div class="card" style="margin-top:16px"><h2 style="font-size:19px">Ganti password role</h2><p class="sub">Disimpan terenkripsi (hash) di Firebase.</p>${['dev','pt','reseller'].map(r=>`<label>${r.toUpperCase()}</label><div style="display:flex;gap:8px"><input id="pw_${r}" placeholder="Password baru"><button class="btn b" onclick="gg('setpw','Password ${r} diganti',{role:'${r}',pw:$('#pw_${r}').value})">Ganti</button></div>`).join('')}</div>
<div class="card" style="margin-top:16px"><h2 style="font-size:19px">Data</h2><p class="sub">Ekspor atau bersihkan database.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn g" onclick="exp('json')">Ekspor JSON</button><button class="btn g" onclick="exp('txt')">Ekspor TXT</button><button class="btn" onclick="confirm('Hapus log?')&&gg('clearlog','Log dihapus')">Hapus log</button><button class="btn r" onclick="prompt('Ketik HAPUS untuk menghapus semua nomor')==='HAPUS'&&gg('wipe','Semua nomor dihapus')">Hapus semua nomor</button></div></div>`,
log:()=>`<div class="card"><h2 style="font-size:19px">60 aktivitas terakhir</h2>${D.logs.map((l,i)=>`<div class="row" style="animation-delay:${Math.min(i,15)*.03}s"><div><b>${E(l.name)}</b> <span class="tag">${l.role}</span> ${E(l.act)} <span class="mono">${l.num||''}</span></div><span class="sub">${fmt(l.at)}</span></div>`).join('')||'<p class="sub">Belum ada aktivitas.</p>'}</div>`};
const addN=()=>go(async()=>{const r=await api('add',{numbers:$('#na').value});toast(`${r.add} ditambah · ${r.skip} sudah ada · ${r.bad} tidak valid`,r.add?'#8ce99a':'#ffe066');show('nomor')});
const act=(a,n)=>go(async()=>{await api(a,{num:n});toast('Berhasil','#8ce99a');show('nomor')});
const gg=(a,m,b)=>go(async()=>{await api(a,b);toast(m,'#8ce99a');a==='save'||a==='setpw'?(await show(PG),shell()):show(PG)});
const cp=t=>navigator.clipboard.writeText(t).then(()=>toast('Disalin','#8ce99a'));
const exp=f=>{const t=f==='json'?JSON.stringify(D.numbers,null,1):D.numbers.map(n=>n.num).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download='database.'+f;a.click()};
fetch('/api').then(r=>r.json()).then(p=>{$('#lname').textContent='MASUK AKUN';if(p.run)$('#lrun').textContent='📣 '+p.run;if(p.maint)$('#lrun').textContent+=' · Mode maintenance aktif'}).catch(()=>{});
if(T)boot();
</script></body></html>
